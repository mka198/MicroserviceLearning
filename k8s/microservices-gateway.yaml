apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: microservices-gateway

spec:
  # Envoy manages this Gateway.
  gatewayClassName: envoy-gateway-class

  listeners:
    # Accept incoming HTTP traffic on port 80.
    - name: http
      protocol: HTTP
      port: 80

    # Accept HTTPS traffic and decrypt it using our TLS Secret.
    - name: https
      protocol: HTTPS
      port: 443

      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: microservices-tls