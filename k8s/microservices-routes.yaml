apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: microservices-routes

spec:
  # Attach these routes to our Gateway.
  parentRefs:
    - name: microservices-gateway
      sectionName: http

  rules:
    # /api/orders goes to OrderService.
    - matches:
        - path:
            type: PathPrefix
            value: /api/orders
      backendRefs:
        - name: orderservice-service
          port: 80

    # /api/inventory goes to InventoryService.
    - matches:
        - path:
            type: PathPrefix
            value: /api/inventory
      backendRefs:
        - name: inventoryservice-service
          port: 80