apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: http-to-https-redirect

spec:
  # Attach this route only to the HTTP listener.
  parentRefs:
    - name: microservices-gateway
      sectionName: http

  rules:
    - filters:
        # Redirect every HTTP request to HTTPS.
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 8443
            statusCode: 301