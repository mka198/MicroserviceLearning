apiVersion: apps/v1
kind: Deployment

metadata:
  name: orderservice-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: orderservice

  template:
    metadata:
      labels:
        app: orderservice

    spec:
      containers:
        - name: orderservice
          image: kabsoft/microservicelearning-orderservice:v3
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          # Checks whether OrderService itself is alive.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Checks whether OrderService can connect to SQL Server.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Load all non-sensitive settings from the shared ConfigMap.
          envFrom:
            - configMapRef:
                name: microservices-config

          env:
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: rabbitmq-username

            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: rabbitmq-password

            - name: ConnectionStrings__OrderDbConStr
              valueFrom:
                secretKeyRef:
                  name: orderservice-secrets
                  key: order-db-connection-string